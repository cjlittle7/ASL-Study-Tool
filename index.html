<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASL Study Tool</title>
  <meta name="description" content="Learn American Sign Language with illustrated flashcards, lessons and self-checked practice.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/learn">
      <span class="brand-mark" aria-hidden="true">✋</span>
      <span>ASL Study Tool</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/learn" data-route="learn">Learn</a>
      <a href="#/cards" data-route="cards">Cards</a>
      <a href="#/practice" data-route="practice">Practice</a>
      <a href="#/sentences" data-route="sentences">Sentences</a>
      <a href="#/progress" data-route="progress">Progress</a>
      <a href="#/record" data-route="record">Record</a>
    </nav>
    <button class="profile-btn" id="profile-btn" type="button">Sign in</button>
  </header>

  <main id="main" tabindex="-1"></main>

  <!-- Grammar dictionary: opens in the bottom-right corner when a term is clicked -->
  <button class="dict-toggle" id="dict-toggle" type="button" aria-controls="dict-panel" aria-expanded="false">
    Dictionary
  </button>
  <aside class="dict-panel" id="dict-panel" aria-label="Grammar dictionary" hidden>
    <div class="dict-head">
      <h2>Dictionary</h2>
      <button class="icon-btn" id="dict-close" type="button" aria-label="Close dictionary">✕</button>
    </div>
    <input class="dict-search" id="dict-search" type="search" placeholder="Search terms" aria-label="Search dictionary">
    <div class="dict-body" id="dict-body"></div>
  </aside>

  <dialog id="profile-dialog" class="dialog"></dialog>
</body>
</html>
